<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://*:* https://*:* ws://*:* wss://*:*; frame-src 'self' blob:; object-src 'self' blob:; worker-src 'self' blob:"

    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personel Management Application</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: #eef4e3;
        color: #2d5a32;
      }
      html.dark body {
        background: #1b2a1e;
        color: #f4f1e4;
      }
      .boot-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 16px;
      }
      .boot-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot-label {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: 14px;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation: none;
          border-right-color: currentColor;
          opacity: 0.4;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('perf-appraisal-theme')
          if (theme === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p class="boot-label">Loading…</p>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
