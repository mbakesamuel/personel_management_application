appId: com.perfappraisal.app
productName: Perf Appraisal
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
win:
  target:
    - nsis
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
