appId: com.perfappraisal.app
productName: Personel Management App
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
electronVersion: 35.7.5
electronDist: ../../node_modules/electron/dist
win:
  target:
    - target: nsis
      arch:
        - x64
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
